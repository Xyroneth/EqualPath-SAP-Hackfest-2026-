# SAP BTP destination used by the SAP Build Process Automation action and by SAP Build Apps.
# BTP cockpit > Connectivity > Destinations > Import, then add the additional properties below.
Name=EQUALPATH_API
Type=HTTP
URL=https://<your-equalpath-app>.cfapps.<region>.hana.ondemand.com
ProxyType=Internet
Authentication=NoAuthentication
Description=EQUALPATH Career Orchestrator API
# Additional properties
sap.processautomation.enabled=true
sap.applicationdevelopment.actions.enabled=true
AppgyverEnabled=true
HTML5.DynamicDestination=true
URL.headers.X-EqualPath-Callback-Secret=<same value as SBPA_CALLBACK_SECRET>
